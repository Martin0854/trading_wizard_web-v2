server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check (must be before other locations)
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Handle app with base path (e.g., /daily-focus/, /portfolio/)
    # Strip the base path prefix and serve files from root
    location ~ ^/(daily-focus|portfolio)(/.*)?$ {
        alias /usr/share/nginx/html$2;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback - if file not found, serve index.html
        try_files $uri $uri/ /index.html;
    }

    # Default location for portal (no base path)
    location / {
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        try_files $uri $uri/ /index.html;
    }
}
