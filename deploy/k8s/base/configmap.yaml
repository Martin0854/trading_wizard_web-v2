apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-wizard-config
  namespace: trading-wizard
data:
  # Backend config
  REDIS_URL: "redis://redis:6379"
  DATABASE_URL: "postgresql://trading:trading@postgres:5432/trading_wizard"

  # Frontend URLs (for cross-app navigation)
