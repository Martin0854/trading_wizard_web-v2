apiVersion: v1
kind: Secret
metadata:
  name: trading-wizard-secrets
  namespace: trading-wizard
type: Opaque
stringData:
  # NOTE: In production, use sealed-secrets, external-secrets, or vault
  # These values should be replaced during deployment via Kustomize overlays
  POSTGRES_PASSWORD: "trading"
  DATABASE_URL: "postgresql://trading:trading@postgres:5432/trading_wizard"
  REDIS_URL: "redis://redis:6379"
