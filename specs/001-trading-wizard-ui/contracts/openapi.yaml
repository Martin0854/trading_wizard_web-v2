openapi: 3.1.0
info:
  title: Trading Wizard API
  version: 1.0.0
  description: |
    Trading Wizard 웹 인터페이스 API.
    - Daily Focus Wizard: 매수 추천 종목 조회
    - My Portfolio Wizard: 포트폴리오 관리
    - 공통: 사용자 데이터 저장/조회 (암호화된 blob)

servers:
  - url: http://localhost:8000
    description: Development server

tags:
  - name: Daily Focus
    description: 매수 추천 관련 API
  - name: Portfolio
    description: 포트폴리오 관리 API
  - name: User Data
    description: 사용자 데이터 저장/조회 API
  - name: Stock
    description: 종목 정보 조회 API

paths:
  # ============================================================
  # Daily Focus Wizard APIs
  # ============================================================
  /api/daily-focus/recommendations:
    get:
      tags:
        - Daily Focus
      summary: 매수 추천 종목 목록 조회
      description: |
        볼린저 밴드 스퀴즈 전략 기반 매수 신호가 발생한 종목 목록을 반환합니다.
        신뢰도 점수 내림차순으로 정렬됩니다.
      parameters:
        - name: confidence_threshold
          in: query
          schema:
            type: number
            default: 55
            minimum: 0
            maximum: 100
          description: 최소 신뢰도 점수 필터
        - name: bollinger_period
          in: query
          schema:
            type: integer
            default: 12
            minimum: 5
            maximum: 50
          description: 볼린저 밴드 기간
        - name: bollinger_std_dev
          in: query
          schema:
            type: number
            default: 1.3
            minimum: 0.5
            maximum: 3.0
          description: 표준편차 배수
      responses:
        '200':
          description: 매수 추천 종목 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyRecommendationListResponse'
        '503':
          description: 데이터 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/daily-focus/stock/{symbol}:
    get:
      tags:
        - Daily Focus
      summary: 종목 상세 분석 정보 조회
      description: 특정 종목의 기술적 지표 및 신호 상세 정보를 반환합니다.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          example: "005930.KS"
          description: 종목코드 (.KS 또는 .KQ 접미사 포함)
      responses:
        '200':
          description: 종목 상세 분석 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDetailResponse'
        '404':
          description: 종목을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # Portfolio Wizard APIs
  # ============================================================
  /api/portfolio/sell-signals:
    post:
      tags:
        - Portfolio
      summary: 보유 종목 매도 신호 조회
      description: |
        제공된 포지션 목록에 대해 매도 신호를 계산합니다.
        손절매, 익절매, 추세 이탈 조건을 확인합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellSignalRequest'
      responses:
        '200':
          description: 매도 신호 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellSignalListResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/portfolio/calculate-pnl:
    post:
      tags:
        - Portfolio
      summary: 포트폴리오 수익률 계산
      description: 제공된 포지션 목록의 현재가를 조회하고 수익률을 계산합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PnLCalculationRequest'
      responses:
        '200':
          description: 수익률 계산 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnLCalculationResponse'

  # ============================================================
  # User Data APIs (암호화된 blob 저장/조회)
  # ============================================================
  /api/user-data/{user_id_hash}:
    get:
      tags:
        - User Data
      summary: 사용자 데이터 조회
      description: |
        사용자 ID 해시로 암호화된 데이터 blob을 조회합니다.
        서버는 데이터를 복호화할 수 없으며, 클라이언트에서 복호화합니다.
      parameters:
        - name: user_id_hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
          description: SHA-256 해시 (hex, 64자)
      responses:
        '200':
          description: 암호화된 사용자 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataResponse'
        '404':
          description: 사용자 데이터 없음 (신규 사용자)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - User Data
      summary: 사용자 데이터 저장
      description: |
        암호화된 데이터 blob을 저장합니다.
        클라이언트에서 암호화된 데이터를 그대로 저장합니다.
      parameters:
        - name: user_id_hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDataSaveRequest'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # Stock APIs (공통)
  # ============================================================
  /api/stocks/search:
    get:
      tags:
        - Stock
      summary: 종목 검색
      description: 종목코드 또는 종목명으로 검색합니다.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: 검색어 (종목코드 또는 종목명)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
          description: 최대 결과 수
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockSearchResponse'

  /api/stocks/kospi100:
    get:
      tags:
        - Stock
      summary: KOSPI Top 100 종목 목록
      description: KOSPI 시가총액 상위 100 종목 목록을 반환합니다.
      responses:
        '200':
          description: KOSPI 100 종목 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockListResponse'

  /api/stocks/{symbol}/price:
    get:
      tags:
        - Stock
      summary: 종목 현재가 조회
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          example: "005930.KS"
      responses:
        '200':
          description: 종목 현재가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPriceResponse'
        '404':
          description: 종목을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # ============================================================
    # Common Schemas
    # ============================================================
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 에러 코드
        message:
          type: string
          description: 사용자 친화적 에러 메시지

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string

    # ============================================================
    # Stock Schemas
    # ============================================================
    Stock:
      type: object
      required:
        - symbol
        - name
        - market
        - currentPrice
      properties:
        symbol:
          type: string
          example: "005930.KS"
        name:
          type: string
          example: "삼성전자"
        market:
          type: string
          enum: [KOSPI, KOSDAQ]
        currentPrice:
          type: number
          example: 72500
        previousClose:
          type: number
          example: 72000
        changePercent:
          type: number
          example: 0.69
        volume:
          type: integer
          example: 12345678
        updatedAt:
          type: string
          format: date-time

    StockListResponse:
      type: object
      properties:
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/Stock'
        updatedAt:
          type: string
          format: date-time

    StockSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Stock'
        total:
          type: integer

    StockPriceResponse:
      type: object
      properties:
        symbol:
          type: string
        currentPrice:
          type: number
        previousClose:
          type: number
        changePercent:
          type: number
        updatedAt:
          type: string
          format: date-time

    # ============================================================
    # Technical Indicators Schemas
    # ============================================================
    BollingerBands:
      type: object
      properties:
        upper:
          type: number
        middle:
          type: number
        lower:
          type: number
        width:
          type: number
        widthMA:
          type: number
        isInSqueeze:
          type: boolean
        isExpanding:
          type: boolean

    MACDIndicator:
      type: object
      properties:
        macd:
          type: number
        signal:
          type: number
        histogram:
          type: number

    TechnicalIndicators:
      type: object
      properties:
        bollinger:
          $ref: '#/components/schemas/BollingerBands'
        rsi:
          type: number
        macd:
          $ref: '#/components/schemas/MACDIndicator'
        volumeRatio:
          type: number
        calculatedAt:
          type: string
          format: date-time

    # ============================================================
    # Daily Focus Schemas
    # ============================================================
    BuyRecommendation:
      type: object
      properties:
        symbol:
          type: string
        stock:
          $ref: '#/components/schemas/Stock'
        confidenceScore:
          type: number
          minimum: 0
          maximum: 100
        signalReason:
          type: string
        indicators:
          $ref: '#/components/schemas/TechnicalIndicators'
        generatedAt:
          type: string
          format: date-time

    BuyRecommendationListResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/BuyRecommendation'
        totalScanned:
          type: integer
          description: 스캔된 총 종목 수
        generatedAt:
          type: string
          format: date-time
        parameters:
          type: object
          properties:
            bollingerPeriod:
              type: integer
            bollingerStdDev:
              type: number
            confidenceThreshold:
              type: number

    StockDetailResponse:
      type: object
      properties:
        stock:
          $ref: '#/components/schemas/Stock'
        indicators:
          $ref: '#/components/schemas/TechnicalIndicators'
        recommendation:
          $ref: '#/components/schemas/BuyRecommendation'
        priceHistory:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              open:
                type: number
              high:
                type: number
              low:
                type: number
              close:
                type: number
              volume:
                type: integer

    # ============================================================
    # Portfolio Schemas
    # ============================================================
    PositionInput:
      type: object
      required:
        - id
        - symbol
        - avgBuyPrice
        - quantity
      properties:
        id:
          type: string
        symbol:
          type: string
        avgBuyPrice:
          type: number
        quantity:
          type: integer

    SellSignalRequest:
      type: object
      required:
        - positions
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionInput'
        settings:
          type: object
          properties:
            stopLossPct:
              type: number
              default: -4.5
            takeProfitPct:
              type: number
              default: 12.0
            sellOnMiddleBand:
              type: boolean
              default: false
            bollingerPeriod:
              type: integer
              default: 12
            bollingerStdDev:
              type: number
              default: 1.3

    SellSignal:
      type: object
      properties:
        positionId:
          type: string
        type:
          type: string
          enum: [stop_loss, take_profit, trend_break]
        reason:
          type: string
        currentPrice:
          type: number
        pnlPercent:
          type: number
        triggerValue:
          type: number

    SellSignalListResponse:
      type: object
      properties:
        signals:
          type: array
          items:
            $ref: '#/components/schemas/SellSignal'
        calculatedAt:
          type: string
          format: date-time

    PnLCalculationRequest:
      type: object
      required:
        - positions
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionInput'

    PositionPnL:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        currentPrice:
          type: number
        currentValue:
          type: number
        pnl:
          type: number
        pnlPercent:
          type: number

    PnLCalculationResponse:
      type: object
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionPnL'
        summary:
          type: object
          properties:
            totalInvested:
              type: number
            totalCurrentValue:
              type: number
            totalPnl:
              type: number
            totalPnlPercent:
              type: number
        calculatedAt:
          type: string
          format: date-time

    # ============================================================
    # User Data Schemas
    # ============================================================
    UserDataResponse:
      type: object
      properties:
        userIdHash:
          type: string
        encryptedBlob:
          type: string
          format: byte
          description: Base64 인코딩된 암호화 데이터
        updatedAt:
          type: string
          format: date-time

    UserDataSaveRequest:
      type: object
      required:
        - encryptedBlob
      properties:
        encryptedBlob:
          type: string
          format: byte
          description: Base64 인코딩된 암호화 데이터
